name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run SwiftLint
        run: swiftlint lint --strict

  build-and-test:
    name: Build & Test (macOS 14)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build CoreKit & TersoApp
        run: swift build -v

      - name: Run Tests
        run: swift test -v
