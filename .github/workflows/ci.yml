name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  safety-audit:
    name: Safety Audit
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Safety Audit
        run: bash .github/scripts/safety-audit.sh

      - name: Test Safety Audit
        run: bash .github/scripts/test-safety-audit.sh

  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Swift 6.1.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1.2"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  build-and-test:
    name: Build & Test (macOS 14)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Swift 6.1.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1.2"

      - name: Show Swift version
        run: swift --version

      - name: Build CoreKit & TersoApp
        run: swift build -v

      - name: Run Tests
        run: swift test -v
