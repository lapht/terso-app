name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    name: Quality Gates (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun swift --version
          swift --version

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat

      - name: Run SwiftLint
        run: swiftlint lint --strict

      - name: Check Swift formatting
        run: swiftformat Sources Tests Package.swift --lint

      - name: Show Swift version
        run: swift --version

      - name: Build app with Xcode
        run: >-
          xcodebuild
          -project Terso.xcodeproj
          -scheme TersoApp
          -configuration Debug
          -destination 'platform=macOS,arch=${{ matrix.architecture }}'
          ARCHS=${{ matrix.architecture }}
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run app unit tests with Xcode
        run: >-
          xcodebuild
          -project Terso.xcodeproj
          -scheme TersoApp
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          ARCHS=${{ matrix.architecture }}
          ONLY_ACTIVE_ARCH=YES
          test

      - name: Run unit and integration tests
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Run Safety Audit
        run: bash .github/scripts/safety-audit.sh

      - name: Test Safety Audit
        run: bash .github/scripts/test-safety-audit.sh
