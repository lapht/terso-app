name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to publish (for example, v0.1.0)
        required: true
        type: string
  push:
    tags:
      - "v0.1*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS release
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Swift 6.1.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1.2"

      - name: Run unit and integration tests
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build, sign, package, and checksum
        run: ./scripts/build-release.sh

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/Terso-v0.1-macOS.zip \
              dist/Terso-v0.1-macOS.zip.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/Terso-v0.1-macOS.zip \
              dist/Terso-v0.1-macOS.zip.sha256 \
              --title "Terso $RELEASE_TAG" \
              --generate-notes
          fi
