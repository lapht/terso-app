name: Bug report
description: Report a reproducible problem with Terso.
title: "bug: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Share only information needed to reproduce the problem. Before attaching logs or paths, redact names, usernames, home-directory paths, and other personal data.
  - type: input
    id: app-version
    attributes:
      label: Terso app version
      description: For example, v0.1.0.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Include the version number (and build number, if known).
      placeholder: macOS 15.0
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple silicon (arm64)
        - Intel (x86_64)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence that reproduces the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: Redact personal data and secrets before sharing. Do not attach an unredacted audit log.
